volumes:
  data01:
    driver: local
  data-s3:

networks:
  automdm-preview:
    name: automdm-preview

services:
  mysql01:
    image: mysql:8.0.44
    platform: linux/x86_64
    volumes:
      - .:/data
    command: mysqld --datadir=/tmp/data --event-scheduler=ON
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: automdm
      MYSQL_USER: automdm
      MYSQL_PASSWORD: automdm
    ports:
      - "3308:3306"
    networks:
      - automdm-preview

  redis01:
    image: redis:6.2
    networks:
      - automdm-preview

  # Normal AutoMDM server running TLS with a self-signed cert to handle the
  # osquery connections.
  automdm01:
    image: automdm/automdm:${AUTOMDM_VERSION:-latest}
    platform: linux/x86_64
    command: sh -c "/usr/bin/automdm prepare db --no-prompt && /usr/bin/automdm serve"
    environment:
      AUTOMDM_S3_SOFTWARE_INSTALLERS_BUCKET: software-installers-preview
      AUTOMDM_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID: locals3
      AUTOMDM_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY: locals3
      AUTOMDM_S3_SOFTWARE_INSTALLERS_ENDPOINT_URL: http://s3:9000
      AUTOMDM_S3_SOFTWARE_INSTALLERS_REGION: localhost
      AUTOMDM_S3_SOFTWARE_INSTALLERS_DISABLE_SSL: true
      AUTOMDM_S3_SOFTWARE_INSTALLERS_FORCE_S3_PATH_STYLE: true
      AUTOMDM_MYSQL_ADDRESS: mysql01:3306
      AUTOMDM_MYSQL_DATABASE: automdm
      AUTOMDM_MYSQL_USERNAME: automdm
      AUTOMDM_MYSQL_PASSWORD: automdm
      AUTOMDM_REDIS_ADDRESS: redis01:6379
      AUTOMDM_SERVER_ADDRESS: 0.0.0.0:8412
      AUTOMDM_SERVER_CERT: /automdm/osquery/automdm.crt
      AUTOMDM_SERVER_KEY: /automdm/osquery/automdm.key
      AUTOMDM_LOGGING_JSON: 'true'
      AUTOMDM_OSQUERY_STATUS_LOG_PLUGIN: filesystem
      AUTOMDM_FILESYSTEM_STATUS_LOG_FILE: /logs/osqueryd.status.log
      AUTOMDM_OSQUERY_RESULT_LOG_PLUGIN: filesystem
      AUTOMDM_FILESYSTEM_RESULT_LOG_FILE: /logs/osqueryd.results.log
      AUTOMDM_BETA_SOFTWARE_INVENTORY: 1
      AUTOMDM_LICENSE_KEY: ${AUTOMDM_LICENSE_KEY}
      AUTOMDM_OSQUERY_LABEL_UPDATE_INTERVAL: 1m
      AUTOMDM_VULNERABILITIES_CURRENT_INSTANCE_CHECKS: "yes"
      AUTOMDM_VULNERABILITIES_DATABASES_PATH: /vulndb
      AUTOMDM_VULNERABILITIES_PERIODICITY: 5m
      AUTOMDM_LOGGING_DEBUG: 'true'
      AUTOMDM_SERVER_PRIVATE_KEY: ${AUTOMDM_SERVER_PRIVATE_KEY}
      AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_CERT: "${AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_CERT:-}"
      AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_KEY: "${AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_KEY:-}"
      # This can be configured for testing purposes but otherwise uses the
      # typical default of provided.
      AUTOMDM_OSQUERY_HOST_IDENTIFIER: ${AUTOMDM_OSQUERY_HOST_IDENTIFIER:-provided}
    depends_on:
      - mysql01
      - redis01
      - s3
    volumes:
      - .:/automdm/
      - ./logs:/logs
      - ./vulndb:/vulndb
      - ./config:/config
    ports:
      - "8412:8412"
    networks:
      automdm-preview:
        aliases:
          # Kind of a funny hack, this allows host.docker.internal to point
          # to the AutoMDM server on Linux hosts where host.docker.internal is not
          # yet added as a host by default in Docker.
          - host.docker.internal
          # Another strange hack, this allows the UI AutoMDM server to see
          # this server as though it were on localhost, thereby allowing it to
          # download the TLS certificate.
          - localhost

  # Run another AutoMDM server listening over plain HTTP bound to port 1337.
  # This is expected to receive UI requests only and not connections from
  # agents.
  automdm02:
    image: automdm/automdm:${AUTOMDM_VERSION:-latest}
    platform: linux/x86_64
    command: sh -c "/usr/bin/automdm prepare db --no-prompt && /usr/bin/automdm serve"
    environment:
      AUTOMDM_S3_SOFTWARE_INSTALLERS_BUCKET: software-installers-preview
      AUTOMDM_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID: locals3
      AUTOMDM_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY: locals3
      AUTOMDM_S3_SOFTWARE_INSTALLERS_ENDPOINT_URL: http://s3:9000
      AUTOMDM_S3_SOFTWARE_INSTALLERS_REGION: localhost
      AUTOMDM_S3_SOFTWARE_INSTALLERS_DISABLE_SSL: true
      AUTOMDM_S3_SOFTWARE_INSTALLERS_FORCE_S3_PATH_STYLE: true
      AUTOMDM_MYSQL_ADDRESS: mysql01:3306
      AUTOMDM_MYSQL_DATABASE: automdm
      AUTOMDM_MYSQL_USERNAME: automdm
      AUTOMDM_MYSQL_PASSWORD: automdm
      AUTOMDM_REDIS_ADDRESS: redis01:6379
      AUTOMDM_SERVER_ADDRESS: 0.0.0.0:1337
      AUTOMDM_SERVER_TLS: "false"
      AUTOMDM_LOGGING_JSON: "true"
      AUTOMDM_SESSION_DURATION: 720h
      AUTOMDM_OSQUERY_STATUS_LOG_PLUGIN: stdout
      AUTOMDM_OSQUERY_RESULT_LOG_PLUGIN: stdout
      AUTOMDM_BETA_SOFTWARE_INVENTORY: 1
      AUTOMDM_LICENSE_KEY: ${AUTOMDM_LICENSE_KEY}
      AUTOMDM_OSQUERY_LABEL_UPDATE_INTERVAL: 1m
      AUTOMDM_VULNERABILITIES_CURRENT_INSTANCE_CHECKS: "no"
      AUTOMDM_SERVER_PRIVATE_KEY: ${AUTOMDM_SERVER_PRIVATE_KEY}
      AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_CERT: "${AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_CERT:-}"
      AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_KEY: "${AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_KEY:-}"
      # This can be configured for testing purposes but otherwise uses the
      # typical default of provided.
      AUTOMDM_OSQUERY_HOST_IDENTIFIER: ${AUTOMDM_OSQUERY_HOST_IDENTIFIER:-provided}
    depends_on:
      - mysql01
      - redis01
      - s3
    volumes:
      - ./config:/config
    ports:
      - "1337:1337"
    networks:
      - automdm-preview

  s3:
    image: rustfs/rustfs:1.0.0-alpha.85
    entrypoint: sh
    command: -c 'mkdir -p /data/software-installers-preview && /usr/bin/rustfs /data'
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_ACCESS_KEY=locals3
      - RUSTFS_SECRET_KEY=locals3
    volumes:
      - data-s3:/data:rw
    networks:
      - automdm-preview
