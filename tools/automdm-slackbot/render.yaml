services:
  - type: web
    name: automdm
    runtime: node
    plan: starter
    rootDir: tools/automdm-slackbot
    buildCommand: yarn install --frozen-lockfile
    startCommand: node app.js
    healthCheckPath: /healthz
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: automdm/automdm
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: GITOPS_BASE_PATH
        value: it-and-security
      - key: GITHUB_BOT_USERNAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: PORT
        value: "3000"
      - key: GITOPS_CI_CHECK_NAME
        value: automdm-gitops
      - key: CI_AUTO_FIX
        value: "true"
      - key: AUTOMDM_MCP_URL
        sync: false
      - key: AUTOMDM_MCP_AUTH_TOKEN
        sync: false
