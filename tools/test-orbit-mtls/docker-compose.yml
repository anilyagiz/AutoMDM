---
services:
  nginx:
    image: nginx
    volumes:
      - ../osquery/automdm.crt:/etc/nginx/certificates/automdm.crt
      - ../osquery/automdm.key:/etc/nginx/certificates/automdm.key
      - ./client-ca.crt:/etc/nginx/certificates/client-ca.crt
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
