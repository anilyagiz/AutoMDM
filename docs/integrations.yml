# Integrations shown at automdm.com/integrations and /integrate/*.
# Only add integrations whose AutoMDM support is confirmed.
# Each integration entry creates its card, its details page at `url`, and its sitemap entry. There's no separate page to add.
#
# categories:
#   name: required
#   slug: required. The category page is /integrate/{slug}.
#
# integrations:
#   name: required
#   url: required. /integrate/{category}/{integration}, lowercase letters, numbers, and dashes.
#   category: required. A category slug from the list above.
#   description: required. Shown on the integration's page.
#   summary: required. One line, shown on the card in the directory.
#   logo: required. A file in website/assets/images/, at least 24px tall at 2x, with a transparent background. Name it logo-{name}-{width}x{height}@2x.png.
#   vendorUrl: optional. Link to the vendor's site.
#   docs: optional. A list of links, each with a label and url.
#   alsoListedIn: optional. Extra category slugs to list the integration under.
#
# buildingBlocks: AutoMDM's own extension points, shown at /integrate/build-anything.
#   name, description, and url: required
#   logo: optional
#
# Redirects to integration pages live in website/config/routes.js.
categories:
  - name: "Identity and access"
    slug: "identity-provider"
  - name: "Zero-touch enrollment"
    slug: "zero-touch-enrollment"
  - name: "Endpoint protection"
    slug: "endpoint-protection"
  - name: "AI models"
    slug: "ai-models"
  - name: "Certificates"
    slug: "certificates"
  - name: "Data lakes and SIEMs"
    slug: "data-lake-and-siem"
  - name: "Workflow automation"
    slug: "workflow-automation"
  - name: "Ticketing"
    slug: "ticketing"
  - name: "Infrastructure as code"
    slug: "infrastructure-as-code"
  - name: "Patching"
    slug: "patching"
  - name: "Compliance"
    slug: "compliance"
  - name: "IT asset management"
    slug: "it-asset-management"
  - name: "Device lifecycle"
    slug: "device-lifecycle"
  - name: "Hosting"
    slug: "hosting"
