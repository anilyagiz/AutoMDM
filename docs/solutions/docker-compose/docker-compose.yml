volumes:
  mysql:
  redis:
  data:
  logs:
  vulndb:

services:
  mysql:
    image: mysql:8
    platform: linux/x86_64
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    cap_add:
      - SYS_NICE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped

  redis:
    image: redis:6
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  automdm-init:
    image: alpine:latest
    volumes:
      - logs:/logs
      - data:/data
      - vulndb:/vulndb
    command: sh -c "chown -R 100:101 /logs /data /vulndb"

  automdm:
    image: automdm/automdm
    platform: linux/x86_64
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      automdm-init:
        condition: service_completed_successfully
    command: sh -c "/usr/bin/automdm prepare db --no-prompt && /usr/bin/automdm serve"
    environment:
      # In-cluster service addresses (no hostnames/ports on the host)
      - AUTOMDM_REDIS_ADDRESS=redis:6379
      - AUTOMDM_MYSQL_ADDRESS=mysql:3306
      - AUTOMDM_MYSQL_DATABASE=${MYSQL_DATABASE}
      - AUTOMDM_MYSQL_USERNAME=${MYSQL_USER}
      - AUTOMDM_MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # AutoMDM HTTP listener
      - AUTOMDM_SERVER_ADDRESS=${AUTOMDM_SERVER_ADDRESS}:${AUTOMDM_SERVER_PORT}
      - AUTOMDM_SERVER_TLS=${AUTOMDM_SERVER_TLS}
      # TLS Certificate paths (only needed if AUTOMDM_SERVER_TLS=true)
      - AUTOMDM_SERVER_CERT=${AUTOMDM_SERVER_CERT}
      - AUTOMDM_SERVER_KEY=${AUTOMDM_SERVER_KEY}
      # Secrets
      - AUTOMDM_SERVER_PRIVATE_KEY=${AUTOMDM_SERVER_PRIVATE_KEY} # Run 'openssl rand -base64 32' to generate
      - AUTOMDM_LICENSE_KEY=${AUTOMDM_LICENSE_KEY}
      # System tuning & other options
      - AUTOMDM_SESSION_DURATION=${AUTOMDM_SESSION_DURATION}
      - AUTOMDM_LOGGING_JSON=${AUTOMDM_LOGGING_JSON}
      - AUTOMDM_OSQUERY_STATUS_LOG_PLUGIN=${AUTOMDM_OSQUERY_STATUS_LOG_PLUGIN}
      - AUTOMDM_FILESYSTEM_STATUS_LOG_FILE=${AUTOMDM_FILESYSTEM_STATUS_LOG_FILE}
      - AUTOMDM_FILESYSTEM_RESULT_LOG_FILE=${AUTOMDM_FILESYSTEM_RESULT_LOG_FILE}
      - AUTOMDM_OSQUERY_LABEL_UPDATE_INTERVAL=${AUTOMDM_OSQUERY_LABEL_UPDATE_INTERVAL}
      - AUTOMDM_VULNERABILITIES_CURRENT_INSTANCE_CHECKS=${AUTOMDM_VULNERABILITIES_CURRENT_INSTANCE_CHECKS}
      - AUTOMDM_VULNERABILITIES_DATABASES_PATH=${AUTOMDM_VULNERABILITIES_DATABASES_PATH}
      - AUTOMDM_VULNERABILITIES_PERIODICITY=${AUTOMDM_VULNERABILITIES_PERIODICITY}
      # Optional S3 info
      - AUTOMDM_S3_SOFTWARE_INSTALLERS_BUCKET=${AUTOMDM_S3_SOFTWARE_INSTALLERS_BUCKET}
      - AUTOMDM_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID=${AUTOMDM_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID}
      - AUTOMDM_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY=${AUTOMDM_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY}
      - AUTOMDM_S3_SOFTWARE_INSTALLERS_FORCE_S3_PATH_STYLE=${AUTOMDM_S3_SOFTWARE_INSTALLERS_FORCE_S3_PATH_STYLE}
      # Override AUTOMDM_S3_SOFTWARE_INSTALLERS_ENDPOINT_URL when using a different S3 compatible
      # object storage backend (such as RustFS) or running S3 locally with localstack.
      # Leave this blank to use the default S3 service endpoint.
      - AUTOMDM_S3_SOFTWARE_INSTALLERS_ENDPOINT_URL=${AUTOMDM_S3_SOFTWARE_INSTALLERS_ENDPOINT_URL}
      # RustFS users should set AUTOMDM_S3_SOFTWARE_INSTALLERS_REGION to any nonempty value (eg. localhost)
      # to short-circuit region discovery
      - AUTOMDM_S3_SOFTWARE_INSTALLERS_REGION=${AUTOMDM_S3_SOFTWARE_INSTALLERS_REGION}
    ports:
      - "${AUTOMDM_SERVER_PORT}:${AUTOMDM_SERVER_PORT}" # UI/API
    volumes:
      - data:/automdm
      - logs:/logs
      - vulndb:${AUTOMDM_VULNERABILITIES_DATABASES_PATH}
      - ./certs/automdm.crt:/automdm/automdm.crt:ro
      - ./certs/automdm.key:/automdm/automdm.key:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$$AUTOMDM_SERVER_TLS\" = \"true\" ]; then wget --no-check-certificate -qO- https://127.0.0.1:${AUTOMDM_SERVER_PORT}/healthz; else wget -qO- http://127.0.0.1:${AUTOMDM_SERVER_PORT}/healthz; fi"
        ]        
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
