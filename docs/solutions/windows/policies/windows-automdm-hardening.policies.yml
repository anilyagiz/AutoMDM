- name: Windows - Hide uninstall and modify options for AutoMDM osquery
  platform: windows
  description: "This policy checks if the uninstall and modify options are hidden for AutoMDM osquery by ensuring both the NoRemove and NoModify registry values are set to 1."
  resolution: "As an IT admin, set the NoRemove and NoModify registry values to 1 under the AutoMDM osquery uninstall key to prevent users from uninstalling or modifying the agent."
  query: SELECT 1 FROM registry nr JOIN registry d ON d.path = REPLACE(nr.path, '\NoRemove', '\DisplayName') JOIN registry nm ON nm.path = REPLACE(nr.path, '\NoRemove', '\NoModify') LEFT JOIN registry p ON p.path = REPLACE(nr.path, '\NoRemove', '\Publisher') WHERE nr.path LIKE 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\%\NoRemove' AND (d.data = 'AutoMDM osquery' OR (d.data = 'AutoMDM' AND p.data = 'Fleet Device Management (automdm.com)')) AND nr.data = '1' AND nm.data = '1';
