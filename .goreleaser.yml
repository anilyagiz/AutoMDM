version: 2

project_name: automdm

monorepo:
  tag_prefix: automdm-
  dir: .

before:
  hooks:
    - make deps
    - make generate

# gomod:
#   proxy: true

builds:
  - id: automdm
    dir: ./cmd/automdm/
    binary: automdm
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -tags=full,fts5,netgo
      - -trimpath
    ldflags:
      # Reduce binary size by stripping debug symbols.
      - -s
      - -w
      - -extldflags "-static"
      - -X github.com/anilyagiz/automdm/v4/server/version.appName={{ .ArtifactName }}
      - -X github.com/anilyagiz/automdm/v4/server/version.version={{ .Version }}
      - -X github.com/anilyagiz/automdm/v4/server/version.branch={{ .Branch }}
      - -X github.com/anilyagiz/automdm/v4/server/version.revision={{ .FullCommit }}
      - -X github.com/anilyagiz/automdm/v4/server/version.buildDate={{ time "2006-01-02" }}
      - -X github.com/anilyagiz/automdm/v4/server/version.buildUser={{ .Env.USER }}

  - id: automdmctl
    dir: ./cmd/automdmctl/
    binary: automdmctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Reduce binary size by stripping debug symbols.
      - -s
      - -w
      - -X github.com/anilyagiz/automdm/v4/server/version.appName={{ .ArtifactName }}
      - -X github.com/anilyagiz/automdm/v4/server/version.version={{ .Version }}
      - -X github.com/anilyagiz/automdm/v4/server/version.branch={{ .Branch }}
      - -X github.com/anilyagiz/automdm/v4/server/version.revision={{ .FullCommit }}
      - -X github.com/anilyagiz/automdm/v4/server/version.buildDate={{ time "2006-01-02" }}
      - -X github.com/anilyagiz/automdm/v4/server/version.buildUser={{ .Env.USER }}

  - id: automdmctl-macos
    dir: ./cmd/automdmctl/
    binary: automdmctl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Reduce binary size by stripping debug symbols.
      - -s
      - -w
      - -X github.com/anilyagiz/automdm/v4/server/version.appName={{ .ArtifactName }}
      - -X github.com/anilyagiz/automdm/v4/server/version.version={{ .Version }}
      - -X github.com/anilyagiz/automdm/v4/server/version.branch={{ .Branch }}
      - -X github.com/anilyagiz/automdm/v4/server/version.revision={{ .FullCommit }}
      - -X github.com/anilyagiz/automdm/v4/server/version.buildDate={{ time "2006-01-02" }}
      - -X github.com/anilyagiz/automdm/v4/server/version.buildUser={{ .Env.USER }}

universal_binaries:
  - id: automdmctl # resulting binary id
    ids: [automdmctl-macos] # source binaries
    replace: true
    name_template: automdmctl # resulting binary name
    hooks:
      post:
        - sh -c "AUTOMDMCTL_BINARY_PATH={{ .Path }} ./tools/sign-automdmctl/main.sh"

archives:
  - id: automdm
    builds:
      - automdm
    name_template: automdm_v{{.Version}}_{{- if eq .Os "darwin" }}macos{{- else }}{{ .Os }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    wrap_in_directory: true

  - id: automdmctl
    builds:
      - automdmctl
    # Note -- changing this can break GitOps and other workflows that expect these filenames to be deterministic!
    name_template: automdmctl_v{{.Version}}_{{- if eq .Os "darwin" }}macos{{- else }}{{ .Os }}_{{.Arch}}{{ end }}
    wrap_in_directory: true

  - id: automdmctl-zip
    builds:
      - automdmctl
    # Note -- changing this can break GitOps and other workflows that expect these filenames to be deterministic!
    name_template: automdmctl_v{{.Version}}_{{- if eq .Os "darwin" }}macos{{- else }}{{ .Os }}_{{.Arch}}{{ end }}
    format: zip
    wrap_in_directory: true

dockers:
  - goos: linux
    goarch: amd64
    ids:
      - automdm
      - automdmctl
    dockerfile: tools/automdm-docker/Dockerfile
    build_flag_templates:
      - "--build-arg=AUTOMDM_VERSION={{.Version}}"
    image_templates:
      - "automdm/automdm:{{ .Tag }}"
      - "automdm/automdm:v{{ .Major }}"

  - goos: linux
    goarch: amd64
    ids:
      - automdmctl
    dockerfile: tools/automdmctl-docker/Dockerfile
    build_flag_templates:
      - "--build-arg=binpath=automdmctl"
    image_templates:
      - "automdm/automdmctl:{{ .Tag }}"
      - "automdm/automdmctl:v{{ .Major }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-untagged"

changelog:
  disable: true

release:
  github:
    owner: automdm
    name: automdm
  draft: true
  prerelease: auto
