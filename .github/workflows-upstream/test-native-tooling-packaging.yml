# This workflow tests generation of automdmd packages with the
# `automdm/automdmctl` Docker image.
name: Test native tooling packaging

on:
  pull_request:
    paths:
      - 'tools/automdmctl-docker/**'
      - 'tools/wix-docker/**'
      - '.github/workflows/test-native-tooling-packaging.yml'
  workflow_dispatch: # Manual
  schedule:
    - cron: "0 5 * * *"

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id}}
  cancel-in-progress: true

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions: {}

jobs:
  test-packaging:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        # build_type == 'remote' means this job will test the automdm/automdmctl:latest from Docker Hub.
        # build_type == 'local' means this job will build the the image locally.
        #
        # On pull_request we only run 'local' (the PR's Dockerfile changes aren't
        # in automdm/automdmctl:latest, so 'remote' has no signal). Schedule and
        # workflow_dispatch run both.
        build_type: ${{ fromJSON(github.event_name == 'pull_request' && '["local"]' || '["remote","local"]') }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout Code
      if: ${{ matrix.build_type ==  'local' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      if: ${{ matrix.build_type ==  'local' }}
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version-file: 'go.mod'

    - name: Build fleetdm/wix
      if: ${{ matrix.build_type ==  'local' }}
      run: make wix-docker

    - name: Build automdm/automdmctl
      if: ${{ matrix.build_type ==  'local' }}
      run: make automdmctl-docker

    - name: Build DEB
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type deb --enroll-secret=foo --automdm-url=https://localhost:8080

    - name: Build DEB with AutoMDM Desktop
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type deb --enroll-secret=foo --automdm-url=https://localhost:8080 --automdm-desktop

    - name: Build RPM
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type rpm --enroll-secret=foo --automdm-url=https://localhost:8080

    - name: Build RPM with AutoMDM Desktop
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type rpm --enroll-secret=foo --automdm-url=https://localhost:8080 --automdm-desktop

    - name: Build MSI
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type msi --enroll-secret=foo --automdm-url=https://localhost:8080

    - name: Build MSI with AutoMDM Desktop
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type msi --enroll-secret=foo --automdm-url=https://localhost:8080 --automdm-desktop

    - name: Build PKG
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type pkg --enroll-secret=foo --automdm-url=https://localhost:8080

    - name: Build PKG with AutoMDM Desktop
      run: docker run -v "$(pwd):/build" automdm/automdmctl package --type pkg --enroll-secret=foo --automdm-url=https://localhost:8080 --automdm-desktop

    - name: Slack Notification
      if: github.event.schedule == '0 5 * * *' && failure()
      uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
      with:
        payload: |
          {
            "text": "${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head.html_url }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️  Tests on automdm/automdmctl docker image failed.\nhttps://github.com/anilyagiz/automdm/actions/runs/${{  github.run_id }}"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_G_HELP_ENGINEERING_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
