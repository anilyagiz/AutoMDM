name: Test latest changes in automdmctl preview

# Tests the `automdmctl preview` command with the AutoMDM server and automdmctl
# built from the same commit, ensuring the starter library and GitOps
# pipeline work end-to-end.

on:
  push:
    branches:
      - main
      - patch-*
      - prepare-*
    paths:
      - 'cmd/automdmctl/**.go'
      - 'pkg/**.go'
      - 'server/service/**.go'
      - 'server/context/**.go'
      - 'orbit/**.go'
      - 'ee/automdmctl/**.go'
      - '.github/workflows/automdmctl-preview-latest.yml'
      - 'tools/osquery/in-a-box'
  pull_request:
    paths:
      - 'cmd/automdmctl/**.go'
      - 'pkg/**.go'
      - 'server/service/**.go'
      - 'server/context/**.go'
      - 'orbit/**.go'
      - 'ee/automdmctl/**.go'
      - '.github/workflows/automdmctl-preview-latest.yml'
      - 'tools/osquery/in-a-box'
  workflow_dispatch: # Manual

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions: {}

jobs:
  test-preview:
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      matrix:
        # Only run on Linux because:
        #   - Linux Docker containers are not supported in Windows.
        #   - Unattended installation of Docker on macOS fails. (see
        #   https://github.com/docker/for-mac/issues/6450)
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version-file: 'go.mod'

    - name: Set up Node.js
      uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d # v3.8.1
      with:
        node-version-file: package.json
        check-latest: true

    - name: Install JS dependencies
      run: make deps

    - name: Generate assets
      run: make generate

    - name: Build AutoMDMctl
      run: make automdmctl

    - name: Build AutoMDM server Docker image
      run: |
        make automdm-static
        cp ./build/automdm automdm
        docker build -t automdm/automdm:dev -f tools/automdm-docker/Dockerfile .
        rm automdm

    - name: Prepare preview config
      run: |
        # Copy the in-a-box config and set pull_policy so Docker uses the
        # locally built image instead of trying to pull from Docker Hub.
        cp -a tools/osquery/in-a-box /tmp/preview-config
        # Add pull_policy: never to automdm01 and automdm02 services
        sed -i '/^  automdm01:/,/^  [^ ]/{s/^\(    image: automdm\/automdm.*\)/\1\n    pull_policy: never/}' /tmp/preview-config/docker-compose.yml
        sed -i '/^  automdm02:/,/^  [^ ]/{s/^\(    image: automdm\/automdm.*\)/\1\n    pull_policy: never/}' /tmp/preview-config/docker-compose.yml

    - name: Run automdmctl preview
      run: |
        ./build/automdmctl preview \
          --tag dev \
          --disable-open-browser \
          --preview-config-path /tmp/preview-config
        sleep 10
        ./build/automdmctl get hosts | tee hosts.txt
        [ $( cat hosts.txt | grep online | wc -l) -eq 8 ]

    - name: Get automdm logs
      if: always()
      run: |
        AUTOMDM_LICENSE_KEY=foo docker compose -f ~/.automdm/preview/docker-compose.yml logs automdm01 automdm02 > automdm-logs.txt
        # Copying logs, otherwise the upload-artifact action uploads the logs in a hidden folder (.team)
        # Old location of orbit logs before v4.43.0
        cp ~/.automdm/preview/orbit.log orbit.log || true
        # New location of orbit logs since v4.43.0
        cp ~/.automdm/preview/orbit/orbit.log orbit.log || true
        cp -r ~/.automdm/preview/logs osquery_result_status_logs

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.os }}-log
        path: |
          automdm-logs.txt
          orbit.log
          osquery_result_status_logs
