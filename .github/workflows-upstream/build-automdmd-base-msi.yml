# This workflow can be used to build an automdmd-base.msi package
# that can be hosted on a local server to test Autopilot workflows.
#
# Output is the automdmd-base.msi itself and the corresponding meta.json.
# Both files should be served at the stable/ path.
name: Build and codesign automdmd-base.msi

on:
  workflow_dispatch: # allow manual action
    inputs:
      orbit-channel:
        description: "TUF channel for the orbit component"
        required: false
        default: "stable"
        type: string
      osqueryd-channel:
        description: "TUF channel for the osqueryd component"
        required: false
        default: "stable"
        type: string
      desktop-channel:
        description: "TUF channel for the AutoMDM Desktop component"
        required: false
        default: "stable"
        type: string
      base-url:
        description: "URL that will host the generated automdmd-base.msi and meta.json at stable/"
        required: true
        type: string

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions: {}

env:
  # Supply-chain guard: refuse npm packages younger than 12 hours. See .npmrc.
  NPM_CONFIG_MIN_RELEASE_AGE: 0.5

jobs:
  build:
    # Wine in the fleetdm/wix image fails on ubuntu-26.04. Use ubuntu-latest once msi
    # generation is pure Go: https://github.com/fleetdm/fleet/issues/50503
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout automdmctl install script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: website/assets/resources/install-automdmctl.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install automdmctl
        run: |
          bash website/assets/resources/install-automdmctl.sh
          echo "$HOME/.automdmctl" >> "$GITHUB_PATH"

      - name: Build MSI
        id: build-msi
        run: |
          automdmctl package --type msi \
            --automdm-desktop \
            --automdm-url dummy \
            --enroll-secret dummy \
            --orbit-channel ${{ github.event.inputs.orbit-channel }} \
            --osqueryd-channel ${{ github.event.inputs.osqueryd-channel }} \
            --desktop-channel ${{ github.event.inputs.desktop-channel }} \
            --outfile automdmd-base.msi

      - name: Upload automdmd-base.msi for code signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows
          path: automdmd-base.msi

  code-sign:
    needs: build
    uses: ./.github/workflows/code-sign-windows.yml
    permissions:
      id-token: write # required for attestations
      attestations: write # required for attestations
    with:
      attest: true
      filename: automdmd-base.msi
      upload_name: automdmd-base-msi
    secrets:
      DIGICERT_KEYLOCKER_CERTIFICATE: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE }}
      DIGICERT_KEYLOCKER_PASSWORD: ${{ secrets.DIGICERT_KEYLOCKER_PASSWORD }}
      DIGICERT_KEYLOCKER_HOST_URL: ${{ secrets.DIGICERT_KEYLOCKER_HOST_URL }}
      DIGICERT_API_KEY: ${{ secrets.DIGICERT_API_KEY }}
      DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT }}

  generate:
    needs: [build, code-sign]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Download signed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: automdmd-base-msi
        
      - name: Hash automdmd-base.msi
        run: |
          echo "automdmd_base_msi_sha256=$(shasum -a 256 automdmd-base.msi | cut -d ' ' -f 1)" >> $GITHUB_ENV

      - name: Generate meta.json
        run: |
          
          echo '{
            "automdmd_base_msi_url": "${{ github.event.inputs.base-url }}/stable/automdmd-base.msi",
            "automdmd_base_msi_sha256": "${{ env.automdmd_base_msi_sha256 }}"
          }' > meta.json
          : # Check that meta.json is valid
          jq -e . >/dev/null 2>&1 <<< $(cat meta.json)

      - name: Upload meta.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meta.json
          path: meta.json