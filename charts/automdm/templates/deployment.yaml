---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: automdm
    chart: automdm
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  name: automdm
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: automdm
      chart: automdm
      component: automdm-server
      heritage: {{ .Release.Service }}
      release: {{ .Release.Name }}
  template:
    metadata:
{{- with .Values.podAnnotations }}
      annotations:
{{- toYaml . | trim | nindent 8 }}
{{- end }}
      labels:
        app: automdm
        chart: automdm
        component: automdm-server
        heritage: {{ .Release.Service }}
        release: {{ .Release.Name }}
    spec:
      initContainers:
      {{- if include "automdm.additionalCAs.enabled" . }}
      - name: install-trusted-cas
        image: "{{ .Values.imageRepository }}:{{ .Values.imageTag }}"
        {{- with .Values.imagePullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
        command:
          - sh
          - -c
          - |
            set -e
            apk add ca-certificates
            echo "Installing trusted CA certificates..."

            for dir in /custom-ca/*; do
              if [ -d "$dir" ]; then
                cp "$dir"/*.crt /usr/local/share/ca-certificates/
              fi
            done

            update-ca-certificates
        volumeMounts:
      {{- range .Values.automdm.additionalCAs.configMaps }}
          - name: ca-configmap-{{ .name }}
            mountPath: /custom-ca/configmap-{{ .name }}
            readOnly: true
      {{- end }}
      {{- range .Values.automdm.additionalCAs.secrets }}
          - name: ca-secret-{{ .name }}
            mountPath: /custom-ca/secret-{{ .name }}
            readOnly: true
      {{- end }}
          - name: ca-certs
            mountPath: /etc/ssl/certs
      {{- end }}
      containers:
      - name: automdm
        command: [/usr/bin/automdm]
        args: ["serve"]
        image: "{{ .Values.imageRepository }}:{{ .Values.imageTag }}"
        {{- with .Values.imagePullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        ports:
        - name: automdm
          containerPort: {{ .Values.automdm.listenPort }}
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
        env:
          ## BEGIN AUTOMDM SECTION
          - name: AUTOMDM_VULNERABILITIES_DATABASES_PATH
            value: /tmp/vuln # /tmp might not work on all cloud providers by default
          - name: AUTOMDM_SERVER_ADDRESS
            value: "0.0.0.0:{{ .Values.automdm.listenPort }}"
          - name: AUTOMDM_AUTH_BCRYPT_COST
            value: "{{ .Values.automdm.auth.bcryptCost }}"
          - name: AUTOMDM_AUTH_SALT_KEY_SIZE
            value: "{{ .Values.automdm.auth.saltKeySize }}"
          - name: AUTOMDM_APP_TOKEN_KEY_SIZE
            value: "{{ .Values.automdm.app.tokenKeySize }}"
          - name: AUTOMDM_APP_TOKEN_VALIDITY_PERIOD
            value: "{{ .Values.automdm.app.inviteTokenValidityPeriod }}"
          - name: AUTOMDM_SESSION_KEY_SIZE
            value: "{{ .Values.automdm.session.keySize }}"
          - name: AUTOMDM_SESSION_DURATION
            value: "{{ .Values.automdm.session.duration }}"
          - name: AUTOMDM_LOGGING_DEBUG
            value: "{{ .Values.automdm.logging.debug }}"
          - name: AUTOMDM_LOGGING_JSON
            value: "{{ .Values.automdm.logging.json }}"
          - name: AUTOMDM_LOGGING_DISABLE_BANNER
            value: "{{ .Values.automdm.logging.disableBanner }}"
          {{- if ne .Values.automdm.mdm.windows.wstepIdentityCertKey "" }}
          - name: AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_CERT_BYTES
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.automdm.secretName }}"
                key: "{{ .Values.automdm.mdm.windows.wstepIdentityCertKey }}"
          - name: AUTOMDM_MDM_WINDOWS_WSTEP_IDENTITY_KEY_BYTES
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.automdm.secretName }}"
                key: "{{ .Values.automdm.mdm.windows.wstepIdentityKeyKey }}"
          {{- end }}
          - name: AUTOMDM_SERVER_TLS
            value: "{{ .Values.automdm.tls.enabled }}"
          {{- if .Values.automdm.tls.enabled }}
          - name: AUTOMDM_SERVER_TLS_COMPATIBILITY
            value: "{{ .Values.automdm.tls.compatibility }}"
          - name: AUTOMDM_SERVER_CERT
            value: "/secrets/tls/{{ .Values.automdm.tls.certSecretKey }}"
          - name: AUTOMDM_SERVER_KEY
            value: "/secrets/tls/{{ .Values.automdm.tls.keySecretKey }}"
          {{- end }}
          ### Carving S3 Configuration
          {{- if ne .Values.automdm.carving.s3.bucketName "" }}
          - name: AUTOMDM_S3_BUCKET
            value: "{{ .Values.automdm.carving.s3.bucketName }}"
          - name: AUTOMDM_S3_PREFIX
            value: "{{ .Values.automdm.carving.s3.prefix }}"
          - name: AUTOMDM_S3_ENDPOINT_URL
            value: "{{ .Values.automdm.carving.s3.endpointURL }}"
          - name: AUTOMDM_S3_FORCE_S3_PATH_STYLE
            value: "{{ .Values.automdm.carving.s3.forceS3PathStyle }}"
          - name: AUTOMDM_S3_CARVES_GCS_IAM_AUTH
            value: "{{ .Values.automdm.carving.s3.gcsIAMAuth }}"
          - name: AUTOMDM_S3_CARVES_REGION
            value: "{{ .Values.automdm.carving.s3.region }}"
          {{- if ne .Values.automdm.carving.s3.accessKeyID "" }}
          - name: AUTOMDM_S3_ACCESS_KEY_ID
            value: "{{ .Values.automdm.carving.s3.accessKeyID }}"
          - name: AUTOMDM_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.automdm.secretName }}"
                key: "{{ .Values.automdm.carving.s3.secretKey }}"
          {{ else }}
          - name: AUTOMDM_S3_STS_ASSUME_ROLE_ARN
            value: "{{ .Values.automdm.carving.s3.stsAssumeRoleARN }}"
          {{- end }}
          {{- end }}
          ### Software Installers S3 Configuration
          {{- if ne .Values.automdm.softwareInstallers.s3.bucketName "" }}
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_BUCKET
            value: "{{ .Values.automdm.softwareInstallers.s3.bucketName }}"
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_PREFIX
            value: "{{ .Values.automdm.softwareInstallers.s3.prefix }}"
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_ENDPOINT_URL
            value: "{{ .Values.automdm.softwareInstallers.s3.endpointURL }}"
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_FORCE_S3_PATH_STYLE
            value: "{{ .Values.automdm.softwareInstallers.s3.forceS3PathStyle }}"
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_GCS_IAM_AUTH
            value: "{{ .Values.automdm.softwareInstallers.s3.gcsIAMAuth }}"
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_REGION
            value: "{{ .Values.automdm.softwareInstallers.s3.region }}"
          {{- if ne .Values.automdm.softwareInstallers.s3.accessKeyID "" }}
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID
            value: "{{ .Values.automdm.softwareInstallers.s3.accessKeyID }}"
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.automdm.secretName }}"
                key: "{{ .Values.automdm.softwareInstallers.s3.secretKey }}"
          {{- else }}
          - name: AUTOMDM_S3_SOFTWARE_INSTALLERS_STS_ASSUME_ROLE_ARN
            value: "{{ .Values.automdm.softwareInstallers.s3.stsAssumeRoleARN }}"
          {{- end }}
          {{- end }}
          {{- if .Values.automdm.license.secretName }}
          - name: AUTOMDM_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                key: {{ .Values.automdm.license.licenseKey }}
                name: {{ .Values.automdm.license.secretName }}
          {{- end }}
          ## END AUTOMDM SECTION
          ## BEGIN MYSQL SECTION
          - name: AUTOMDM_MYSQL_ADDRESS
            value: "{{ .Values.database.address }}"
          - name: AUTOMDM_MYSQL_DATABASE
            value: "{{ .Values.database.database }}"
          - name: AUTOMDM_MYSQL_USERNAME
            value: "{{ .Values.database.username }}"
          - name: AUTOMDM_MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database.secretName }}
                key: {{ .Values.database.passwordKey }}
          - name: AUTOMDM_MYSQL_MAX_OPEN_CONNS
            value: "{{ .Values.database.maxOpenConns }}"
          - name: AUTOMDM_MYSQL_MAX_IDLE_CONNS
            value: "{{ .Values.database.maxIdleConns }}"
          - name: AUTOMDM_MYSQL_CONN_MAX_LIFETIME
            value: "{{ .Values.database.connMaxLifetime }}"
          {{- if .Values.database.tls.enabled }}
          {{- if .Values.database.tls.caCertKey }}
          - name: AUTOMDM_MYSQL_TLS_CA
            value: "/secrets/mysql/{{ .Values.database.tls.caCertKey }}"
          {{- end }}
          {{- if .Values.database.tls.certKey }}
          - name: AUTOMDM_MYSQL_TLS_CERT
            value: "/secrets/mysql/{{ .Values.database.tls.certKey }}"
          {{- end }}
          {{- if .Values.database.tls.keyKey }}
          - name: AUTOMDM_MYSQL_TLS_KEY
            value: "/secrets/mysql/{{ .Values.database.tls.keyKey }}"
          {{- end }}
          - name: AUTOMDM_MYSQL_TLS_CONFIG
            value: "{{ .Values.database.tls.config }}"
          - name: AUTOMDM_MYSQL_TLS_SERVER_NAME
            value: "{{ .Values.database.tls.serverName }}"
          {{- end }}
          ## END MYSQL SECTION
          ## BEGIN MYSQL READ REPLICA SECTION
          {{- if .Values.database_read_replica }}
          {{- if .Values.database_read_replica.address }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_ADDRESS
            value: "{{ .Values.database_read_replica.address }}"
          {{- end }}
          {{- if .Values.database_read_replica.database }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_DATABASE
            value: "{{ .Values.database_read_replica.database }}"
          {{- end }}
          {{- if .Values.database_read_replica.username }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_USERNAME
            value: "{{ .Values.database_read_replica.username }}"
          {{- end }}
          {{- if .Values.database_read_replica.passwordPath }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_PASSWORD_PATH
            value: "{{ .Values.database_read_replica.passwordPath }}"
          {{- end }}
          {{- if .Values.database_read_replica.secretName }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.database_read_replica.secretName }}
                key: {{ .Values.database_read_replica.passwordKey }}
          {{- end }}
          {{- if .Values.database_read_replica.maxOpenConns }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_MAX_OPEN_CONNS
            value: "{{ .Values.database_read_replica.maxOpenConns }}"
          {{- end }}
          {{- if .Values.database_read_replica.maxIdleConns }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_MAX_IDLE_CONNS
            value: "{{ .Values.database_read_replica.maxIdleConns }}"
          {{- end }}
          {{- if .Values.database_read_replica.connMaxLifetime }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_CONN_MAX_LIFETIME
            value: "{{ .Values.database_read_replica.connMaxLifetime }}"
          {{- end }}
          {{- if .Values.database_read_replica.tls.enabled }}
          {{- if .Values.database_read_replica.tls.caCertKey }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_TLS_CA
            value: "/secrets/mysql/{{ .Values.database_read_replica.tls.caCertKey }}"
          {{- end }}
          {{- if .Values.database_read_replica.tls.certKey }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_TLS_CERT
            value: "/secrets/mysql/{{ .Values.database_read_replica.tls.certKey }}"
          {{- end }}
          {{- if .Values.database_read_replica.tls.keyKey }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_TLS_KEY
            value: "/secrets/mysql/{{ .Values.database_read_replica.tls.keyKey }}"
          {{- end }}
          {{- if .Values.database_read_replica.tls.config }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_TLS_CONFIG
            value: "{{ .Values.database_read_replica.tls.config }}"
          {{- end }}
          {{- if .Values.database_read_replica.tls.serverName }}
          - name: AUTOMDM_MYSQL_READ_REPLICA_TLS_SERVER_NAME
            value: "{{ .Values.database_read_replica.tls.serverName }}"
          {{- end }}
          {{- end }}
          {{- end }}
          ## END MYSQL READ REPLICA SECTION
          ## BEGIN REDIS SECTION
          - name: AUTOMDM_REDIS_ADDRESS
            value: "{{ .Values.cache.address }}"
          - name: AUTOMDM_REDIS_DATABASE
            value: "{{ .Values.cache.database }}"
          {{- if .Values.cache.usePassword }}
          - name: AUTOMDM_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.cache.secretName }}"
                key: "{{ .Values.cache.passwordKey }}"
          {{- end }}
          ## END REDIS SECTION
          ## BEGIN OSQUERY SECTION
          - name: AUTOMDM_OSQUERY_NODE_KEY_SIZE
            value: "{{ .Values.osquery.nodeKeySize }}"
          - name: AUTOMDM_OSQUERY_LABEL_UPDATE_INTERVAL
            value: "{{ .Values.osquery.labelUpdateInterval }}"
          - name: AUTOMDM_OSQUERY_DETAIL_UPDATE_INTERVAL
            value: "{{ .Values.osquery.detailUpdateInterval }}"
          - name: AUTOMDM_OSQUERY_STATUS_LOG_PLUGIN
            value: "{{ .Values.osquery.logging.statusPlugin }}"
          - name: AUTOMDM_OSQUERY_RESULT_LOG_PLUGIN
            value: "{{ .Values.osquery.logging.resultPlugin }}"
          {{- if eq .Values.osquery.logging.statusPlugin "filesystem" }}
          - name: AUTOMDM_FILESYSTEM_STATUS_LOG_FILE
            value: "/logs/{{ .Values.osquery.logging.filesystem.statusLogFile }}"
          {{- end }}
          {{- if eq .Values.osquery.logging.resultPlugin "filesystem" }}
          - name: AUTOMDM_FILESYSTEM_RESULT_LOG_FILE
            value: "/logs/{{ .Values.osquery.logging.filesystem.resultLogFile }}"
          {{- end }}
          {{- if or (eq .Values.osquery.logging.statusPlugin "filesystem") (eq .Values.osquery.logging.resultPlugin "filesystem") }}
          - name: AUTOMDM_FILESYSTEM_ENABLE_LOG_ROTATION
            value: "{{ .Values.osquery.logging.filesystem.enableRotation }}"
          - name: AUTOMDM_FILESYSTEM_ENABLE_LOG_COMPRESSION
            value: "{{ .Values.osquery.logging.filesystem.enableCompression }}"
          {{- end }}

          {{- if or (eq .Values.osquery.logging.statusPlugin "firehose") (eq .Values.osquery.logging.resultPlugin "firehose") }}
          - name: AUTOMDM_FIREHOSE_REGION
            value: "{{ .Values.osquery.logging.firehose.region }}"
          {{- if eq .Values.osquery.logging.statusPlugin "firehose" }}
          - name: AUTOMDM_FIREHOSE_STATUS_STREAM
            value: "{{ .Values.osquery.logging.firehose.statusStream }}"
          {{- end }}
          {{- if eq .Values.osquery.logging.resultPlugin "firehose" }}
          - name: AUTOMDM_FIREHOSE_RESULT_STREAM
            value: "{{ .Values.osquery.logging.firehose.resultStream }}"
          {{- end }}
          {{- if ne .Values.osquery.logging.firehose.accessKeyID "" }}
          - name: AUTOMDM_FIREHOSE_ACCESS_KEY_ID
            value: "{{ .Values.osquery.logging.firehose.accessKeyID }}"
          - name: AUTOMDM_FIREHOSE_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.osquery.secretName }}"
                key: "{{ .Values.osquery.logging.firehose.secretKey }}"
          {{ else }}
          - name: AUTOMDM_FIREHOSE_STS_ASSUME_ROLE_ARN
            value: "{{ .Values.osquery.logging.firehose.stsAssumeRoleARN }}"
          {{- end }}
          {{- end }}

          {{- if or (eq .Values.osquery.logging.statusPlugin "kinesis") (eq .Values.osquery.logging.resultPlugin "kinesis") }}
          - name: AUTOMDM_KINESIS_REGION
            value: "{{ .Values.osquery.logging.kinesis.region }}"
          {{- if eq .Values.osquery.logging.statusPlugin "kinesis" }}
          - name: AUTOMDM_KINESIS_STATUS_STREAM
            value: "{{ .Values.osquery.logging.kinesis.statusStream }}"
          {{- end }}
          {{- if eq .Values.osquery.logging.resultPlugin "kinesis" }}
          - name: AUTOMDM_KINESIS_RESULT_STREAM
            value: "{{ .Values.osquery.logging.kinesis.resultStream }}"
          {{- end }}
          {{- if ne .Values.osquery.logging.kinesis.accessKeyID "" }}
          - name: AUTOMDM_KINESIS_ACCESS_KEY_ID
            value: "{{ .Values.osquery.logging.kinesis.accessKeyID }}"
          - name: AUTOMDM_KINESIS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.osquery.secretName }}"
                key: "{{ .Values.osquery.logging.kinesis.secretKey }}"
          {{ else }}
          - name: AUTOMDM_KINESIS_STS_ASSUME_ROLE_ARN
            value: "{{ .Values.osquery.logging.kinesis.stsAssumeRoleARN }}"
          {{- end }}
          {{- end }}

          {{- if or (eq .Values.osquery.logging.statusPlugin "lambda") (eq .Values.osquery.logging.resultPlugin "lambda") }}
          - name: AUTOMDM_LAMBDA_REGION
            value: "{{ .Values.osquery.logging.lambda.region }}"
          {{- if eq .Values.osquery.logging.statusPlugin "lambda" }}
          - name: AUTOMDM_LAMBDA_STATUS_FUNCTION
            value: "{{ .Values.osquery.logging.lambda.statusFunction }}"
          {{- end }}
          {{- if eq .Values.osquery.logging.resultPlugin "lambda" }}
          - name: AUTOMDM_LAMBDA_RESULT_FUNCTION
            value: "{{ .Values.osquery.logging.lambda.resultFunction }}"
          {{- end }}
          {{- if ne .Values.osquery.logging.lambda.accessKeyID "" }}
          - name: AUTOMDM_LAMBDA_ACCESS_KEY_ID
            value: "{{ .Values.osquery.logging.lambda.accessKeyID }}"
          - name: AUTOMDM_LAMBDA_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.osquery.secretName }}"
                key: "{{ .Values.osquery.logging.lambda.secretKey }}"
          {{ else }}
          - name: AUTOMDM_LAMBDA_STS_ASSUME_ROLE_ARN
            value: "{{ .Values.osquery.logging.lambda.stsAssumeRoleARN }}"
          {{- end }}
          {{- end }}


          {{- if or (eq .Values.osquery.logging.statusPlugin "pubsub") (eq .Values.osquery.logging.resultPlugin "pubsub") }}
          - name: AUTOMDM_PUBSUB_PROJECT
            value: "{{ .Values.osquery.logging.pubsub.project }}"
          {{- end }}
          {{- if eq .Values.osquery.logging.statusPlugin "pubsub" }}
          - name: AUTOMDM_PUBSUB_STATUS_TOPIC
            value: "{{ .Values.osquery.logging.pubsub.statusTopic }}"
          {{- end }}
          {{- if eq .Values.osquery.logging.resultPlugin "pubsub" }}
          - name: AUTOMDM_PUBSUB_RESULT_TOPIC
            value: "{{ .Values.osquery.logging.pubsub.resultTopic }}"
          {{- end }}
          ## END OSQUERY SECTION

          ## BEGIN VULNERABILITY PROCESSING
          # Disable vulnerability processing in the main deployment when the
          # dedicated cron is setup to reduce total cpu/memory utilization
          {{- if .Values.vulnProcessing.dedicated }}
          - name: AUTOMDM_VULNERABILITIES_DISABLE_SCHEDULE
            value: "true"
          {{- end }}
          ## END Vulnerability Processing

          ## APPEND ENVIRONMENT VARIABLES FROM VALUES
          # Skip empty/unset values so an env var provided via envsFrom (e.g. a
          # secretKeyRef for AUTOMDM_SERVER_PRIVATE_KEY) isn't duplicated by the
          # empty default here, which server-side apply rejects as a
          # duplicate env entry.
          {{- range $key, $value := .Values.environments }}
          {{- if and (ne (kindOf $value) "invalid") (or (ne (kindOf $value) "string") (ne $value "")) }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          ## APPEND ENVIRONMENT VARIABLES FROM SECRETS/CMs
          {{- range .Values.envsFrom }}
          - name: {{ .name }}
            valueFrom:
          {{- if .valueFrom.configMapKeyRef }}
              configMapKeyRef:
                name: {{ .valueFrom.configMapKeyRef.name }}
                key: {{ .valueFrom.configMapKeyRef.key }}
          {{- else if .valueFrom.secretKeyRef }}
              secretKeyRef:
                name: {{ .valueFrom.secretKeyRef.name }}
                key: {{ .valueFrom.secretKeyRef.key }}
          {{- end }}
          {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          privileged: false
          {{- if hasKey .Values.automdm.securityContext "readOnlyRootFilesystem" }}
          readOnlyRootFilesystem: {{ .Values.automdm.securityContext.readOnlyRootFilesystem }}
          {{- else }}
          readOnlyRootFilesystem: true
          {{- end }}
          {{- if .Values.automdm.securityContext.runAsGroup }}
          runAsGroup: {{ int64 .Values.automdm.securityContext.runAsGroup }}
          {{- end }}
          {{- if .Values.automdm.securityContext.runAsUser }}
          runAsUser: {{ int64 .Values.automdm.securityContext.runAsUser }}
          {{- end }}
          {{- if .Values.automdm.securityContext.runAsNonRoot }}
          runAsNonRoot: {{ .Values.automdm.securityContext.runAsNonRoot }}
          {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.automdm.listenPort }}
            {{- if .Values.automdm.tls.enabled }}
            scheme: HTTPS
            {{- end }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.automdm.listenPort }}
            {{- if .Values.automdm.tls.enabled }}
            scheme: HTTPS
            {{- end }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        {{- if or (.Values.automdm.tls.enabled) (.Values.database.tls.enabled) (eq .Values.osquery.logging.statusPlugin "filesystem") (eq .Values.osquery.logging.resultPlugin "filesystem") (include "automdm.additionalCAs.enabled" .) }}
          {{- if .Values.automdm.tls.enabled }}
          - name: automdm-tls
            readOnly: true
            mountPath: /secrets/tls
          {{- end }}
          {{- if .Values.database.tls.enabled }}
          - name: mysql-tls
            readOnly: true
            mountPath: /secrets/mysql
          {{- end }}
          {{- if or (eq .Values.osquery.logging.statusPlugin "filesystem") (eq .Values.osquery.logging.resultPlugin "filesystem") }}
          - name: osquery-logs
            mountPath: /logs
          {{- end }}
          {{- if include "automdm.additionalCAs.enabled" . }}
          - name: ca-certs
            mountPath: /etc/ssl/certs
          {{- end }}
          {{- with .Values.automdm.extraVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- if .Values.gke.cloudSQL.enableProxy }}
      - name: cloudsql-proxy
        image: "{{ .Values.gke.cloudSQL.imageRepository }}:{{ .Values.gke.cloudSQL.imageTag }}"
        command:
        - "/cloud_sql_proxy"
        - "-verbose={{ .Values.gke.cloudSQL.verbose}}"
        - "-instances={{ .Values.gke.cloudSQL.instanceName }}=tcp:3306"
        resources:
          limits:
            cpu: 0.5 # 500Mhz
            memory: 150Mi
          requests:
            cpu: 0.1 # 100Mhz
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          privileged: false
          readOnlyRootFilesystem: true
          {{- if .Values.automdm.securityContext.runAsGroup }}
          runAsGroup: {{ int64 .Values.automdm.securityContext.runAsGroup }}
          {{- end }}
          {{- if .Values.automdm.securityContext.runAsUser }}
          runAsUser: {{ int64 .Values.automdm.securityContext.runAsUser }}
          {{- end }}
          {{- if .Values.automdm.securityContext.runAsNonRoot }}
          runAsNonRoot: {{ .Values.automdm.securityContext.runAsNonRoot }}
          {{- end }}
      {{- end }}
      hostPID: false
      hostNetwork: false
      hostIPC: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8}}
      {{- end }}
      serviceAccountName: automdm
      volumes:
        - name: tmp
          emptyDir:
      {{- if or (.Values.automdm.tls.enabled) (.Values.database.tls.enabled) (eq .Values.osquery.logging.statusPlugin "filesystem") (eq .Values.osquery.logging.resultPlugin "filesystem") (include "automdm.additionalCAs.enabled" .) }}
        {{- if .Values.automdm.tls.enabled }}
        - name: automdm-tls
          secret:
            {{- if .Values.automdm.tls.uniqueTLSSecret }}
            secretName: "{{ .Values.automdm.tls.secretName }}"
            {{- else }}
            secretName: "{{ .Values.automdm.secretName }}"
            {{- end }}
        {{- end }}
        {{- if .Values.database.tls.enabled }}
        - name: mysql-tls
          secret:
            secretName: "{{ .Values.database.secretName }}"
        {{- end }}
        {{- if or (eq .Values.osquery.logging.statusPlugin "filesystem") (eq .Values.osquery.logging.resultPlugin "filesystem") }}
        - name: osquery-logs
          emptyDir:
            sizeLimit: "{{ .Values.osquery.logging.filesystem.volumeSize }}"
        {{- end }}
        {{- with .Values.automdm.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "automdm.additionalCAs.enabled" . }}
        {{- range .Values.automdm.additionalCAs.configMaps }}
        - name: ca-configmap-{{ .name }}
          configMap:
            name: {{ .name }}
        {{- end }}
        {{- range .Values.automdm.additionalCAs.secrets }}
        - name: ca-secret-{{ .name }}
          secret:
            secretName: {{ .name }}
        {{- end }}
        - name: ca-certs
          emptyDir: {}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
