apiVersion:  skaffold/v2beta28
kind: Config
deploy:
  helm:
    releases:
    - name: automdm
      imageStrategy:
        helm: {}
      chartPath: ./automdm
      valuesFiles:
      - ./automdm/values.yaml
      recreatePods: false
      setValues:
        image.pullPolicy: Never
        imageTag: main
        replicas: 1
        hostName: automdm.example.com
        database.secretName: automdm-mysql
        database.address: automdm-mysql:3306
        cache.secretName: automdm-redis
        cache.address: automdm-valkey:6379
        ingress.enabled: true
        ingress.hosts[0].host: automdm.example.com
        ingress.tls[0].secretName: automdm-web-tls
        ingress.tls[0].hosts: ["automdm.example.com"]
        automdm.tls.enabled: false
        mysql.enabled: true
        mysql.auth.username: automdm
        mysql.auth.database: automdm
        redis.enabled: true
        valkey.auth.enabled: false
        valkey.replica.enabled: false
