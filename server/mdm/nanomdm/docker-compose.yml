---
services:
  # MySQL runs on the host's native architecture; set AUTOMDM_MYSQL_PLATFORM (e.g. linux/amd64) to override.
  mysql_nanomdm_test:
    image: ${AUTOMDM_MYSQL_IMAGE:-mysql:8.0.44}
    platform: ${AUTOMDM_MYSQL_PLATFORM:-}
    # innodb-file-per-table=OFF gives ~20% speedup for test runs.
    command: [
      "mysqld",
      "--datadir=/tmpfs",
      "--slow_query_log=1",
      "--log_output=TABLE",
      "--log-queries-not-using-indexes",
      "--innodb-file-per-table=OFF",
      "--table-definition-cache=8192",
      # These 3 keys run MySQL with GTID consistency enforced to avoid issues with production deployments that use it.
      "--enforce-gtid-consistency=ON",
      "--log-bin=bin.log",
      "--server-id=1",
      # Required for storage of Apple MDM bootstrap packages.
      "--max_allowed_packet=536870912",
    ]
    environment: &mysql-default-environment
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: automdm
      MYSQL_USER: automdm
      MYSQL_PASSWORD: insecure
      # This is required by Percona XtraDB server.
      CLUSTER_NAME: automdm
    ports:
      - "3800:3306"
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid
      - /tmpfs
