policies:
queries:
agent_options:
  path: ./lib/agent-options.yml
controls:
  apple_settings:
    configuration_profiles:
      - path: ./lib/macos-password-secret.mobileconfig
  windows_mdm_enabled: true
  windows_settings:
    configuration_profiles:
      - path: ./lib/windows-screenlock-secret.xml
  scripts:
    - path: ./lib/automdm-secret.sh
org_settings:
  server_settings:
    server_url: $AUTOMDM_URL
  org_info:
    org_name: AutoMDM
  secrets:
    - secret: "$AUTOMDM_GLOBAL_ENROLL_SECRET"
